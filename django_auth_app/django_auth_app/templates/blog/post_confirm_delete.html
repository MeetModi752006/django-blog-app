{% extends 'base.html' %}
{% block title %}Delete Post{% endblock %}

{% block content %}

<style>
/* ===============================
   Global styling for delete page
   Soft UI + modern glass look
================================ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

:root {
    --danger: #ff4d4f;
    --text-dark: #0f172a;
    --text-soft: #64748b;
    --page-bg: #f8fafc;
}

body {
    background: var(--page-bg);
    font-family: 'Inter', sans-serif;
}

/* Centering the confirmation card */
.wrapper {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

/* ===============================
   Confirmation Card Design
   Glassmorphism style container
================================ */
.card {
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(18px);
    max-width: 380px;
    width: 100%;
    padding: 3rem 2rem;
    border-radius: 36px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 15px 40px rgba(0,0,0,0.06);
    transition: all 0.4s ease;
}

/* Animation trigger when deleting starts */
.is-deleting .card {
    animation: fadeOut 0.9s ease forwards;
}

/* Smooth vanish effect */
@keyframes fadeOut {
    0% { opacity: 1; transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { opacity: 0; transform: scale(0.8); filter: blur(10px); }
}

/* Warning icon container */
.icon-box {
    width: 56px;
    height: 56px;
    background: white;
    color: var(--danger);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    box-shadow: 0 10px 20px rgba(255,77,79,0.12);
}

/* Title text */
.title {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 0.6rem;
}

/* Description text */
.text {
    font-size: 0.95rem;
    color: var(--text-soft);
    line-height: 1.6;
    margin-bottom: 2rem;
}

/* Highlight post title */
.post-name {
    display: block;
    margin-top: 0.5rem;
    font-weight: 600;
    color: var(--text-dark);
}

/* ===============================
   Button Layout
================================ */
.actions {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
}

/* Base button styling */
.btn {
    padding: 1rem;
    border-radius: 16px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: 0.3s ease;
}

/* Confirm delete button */
.btn-danger {
    background: var(--text-dark);
    color: white;
}

.btn-danger:hover {
    background: black;
    transform: translateY(-2px);
}

/* Cancel button */
.btn-cancel {
    background: transparent;
    color: var(--text-soft);
    text-decoration: none;
}

.btn-cancel:hover {
    color: var(--text-dark);
}

/* ===============================
   Soft particle effect (dust feel)
================================ */
.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--text-soft);
    border-radius: 50%;
    animation: floatUp 0.8s ease forwards;
}

@keyframes floatUp {
    0% { opacity: 0.7; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-60px); }
}
</style>

<div class="wrapper">
    <div class="card" id="cardBox">

        <!-- Warning icon section -->
        <div class="icon-box">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M19 7l-1 13a2 2 0 01-2 2H8a2 2 0 01-2-2L5 7m5 4v6m4-6v6M4 7h16M9 4h6a1 1 0 011 1v2H8V5a1 1 0 011-1z"/>
            </svg>
        </div>

        <h1 class="title">Confirm deletion?</h1>

        <p class="text">
            This action will permanently remove the post:
            <span class="post-name">“{{ post.title }}”</span>
        </p>

        <!-- Delete confirmation form -->
        <form method="post" id="deleteForm">
            {% csrf_token %}

            <div class="actions">
                <!-- Button triggers JS animation before actual submit -->
                <button type="button" class="btn btn-danger" onclick="startDelete()">
                    Delete Post
                </button>

                <!-- Safe navigation back -->
                <a href="{{ post.get_absolute_url }}" class="btn-cancel">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
/* ===============================
   Delete animation handler
   Adds small visual feedback before form submit
================================ */
function startDelete() {
    const wrapper = document.querySelector('.wrapper');
    const card = document.getElementById('cardBox');
    const form = document.getElementById('deleteForm');
    const btn = document.querySelector('.btn-danger');

    btn.disabled = true;
    btn.innerText = "Deleting...";

    wrapper.classList.add('is-deleting');

    createParticles(card);

    // small delay so animation is visible
    setTimeout(() => {
        form.submit();
    }, 900);
}

/* Creates soft floating particles effect */
function createParticles(card) {
    const rect = card.getBoundingClientRect();

    for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.className = 'particle';

        p.style.left = rect.left + Math.random() * rect.width + 'px';
        p.style.top = rect.top + Math.random() * rect.height + 'px';
        p.style.animationDelay = (Math.random() * 0.3) + 's';

        document.body.appendChild(p);

        setTimeout(() => p.remove(), 900);
    }
}
</script>

{% endblock %}
